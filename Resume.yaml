      - label: Frontend
        details: ReactJS, Redux, Redux-Saga, Redux-Forms, Formik, React Hook Form, Styled-Components, ReactJSS, Material UI, Moment.js, i18n, GraphQL, REST, Jest, Playwright, Next.js, Angular, NgRx, RxJS, JointJS
      - label: DevOps
        details: Docker, Docker Swarm, Docker Compose, Azure, AWS, GCP, Terraform, Ansible, Portainer, KVM, GitHub Actions, GitLab Pipelines, Azure DevOps, Visual Studio App Center, CircleCI
      - label: Mobile
